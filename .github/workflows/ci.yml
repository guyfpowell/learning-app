name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # @learning/shared is a file: dep at ../learning/packages/shared — check
      # that repo out alongside so pnpm can resolve it.
      # If guyfpowell/learning is private, add: token: ${{ secrets.LEARNING_REPO_PAT }}
      - name: Checkout learning (shared package)
        uses: actions/checkout@v4
        with:
          repository: guyfpowell/learning
          path: ../learning

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Typechecks app source + unit tests. e2e/ is excluded (has its own
      # e2e/tsconfig.json; Detox types are scoped there to avoid SystemElement
      # global conflicts with @testing-library/react-native).
      - run: pnpm exec tsc --noEmit

      - run: pnpm test:ci

      - run: pnpm audit --prod --audit-level=high
        continue-on-error: true
